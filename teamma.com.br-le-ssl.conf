<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName teamma.com.br
    ServerAlias www.teamma.com.br

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPass        / http://127.0.0.1:3018/ timeout=120 connectiontimeout=15 retry=0
    ProxyPassReverse / http://127.0.0.1:3018/

    ErrorLog ${APACHE_LOG_DIR}/teamma.com.br-error.log
    CustomLog ${APACHE_LOG_DIR}/teamma.com.br-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/teamma.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/teamma.com.br/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
