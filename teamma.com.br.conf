<VirtualHost *:80>
    ServerName teamma.com.br
    ServerAlias www.teamma.com.br

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120

    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
    RequestHeader set X-Forwarded-Port "expr=%{SERVER_PORT}"

    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPass        / http://127.0.0.1:3018/ timeout=120 connectiontimeout=15 retry=0
    ProxyPassReverse / http://127.0.0.1:3018/

    ErrorLog ${APACHE_LOG_DIR}/teamma.com.br-error.log
    CustomLog ${APACHE_LOG_DIR}/teamma.com.br-access.log combined

    RewriteEngine on
    # Não redireciona quando o visitante já veio em HTTPS pela Cloudflare (Flexible).
    RewriteCond %{HTTP:CF-Visitor} !'"scheme":"https"'
    RewriteCond %{HTTP:X-Forwarded-Proto} !=https
    RewriteCond %{SERVER_NAME} =teamma.com.br [OR]
    RewriteCond %{SERVER_NAME} =www.teamma.com.br
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
